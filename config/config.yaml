# Jira Connection Settings
jira:
  url: ""
  email: ""
  api_token: ""
  timeout_seconds: 15

# Default CLI Preferences
defaults:
  project: ""              # Fallback project key if omitted in commands
  board_id: ""                 # Optional default board ID for sprint queries
  output_format: "table"       # Terminal output style: table, json, or yaml

# Local Storage Settings
storage:
  base: "~/.storage/xyanpse"

# Cache Expiration (hours)
# When a locally cached ticket or sprint is older than this, get commands
# auto-refresh it from the Jira server. Set to 0 to disable auto-refresh.
expiration:
  hours: 24

# OpenCode Integration (used by plan and implement commands)
opencode:
  bin: "opencode"      # Path or name of the opencode binary on PATH
  model: ""            # Optional provider/model override, e.g. "anthropic/claude-sonnet-4"
  auto_approve: false  # Pass --auto to opencode run (implement may edit files without prompting)
  dir: ""              # Target repo directory (default: current working directory)
