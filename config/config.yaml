# Jira Connection Settings
jira:
  url: ""
  email: ""
  api_token: ""
  timeout_seconds: 15

# Default CLI Preferences
defaults:
  project: ""              # Fallback project key if omitted in commands
  board_id: ""                 # Optional default board ID for sprint queries
  output_format: "table"       # Terminal output style: table, json, or yaml

# Per-Project Settings (optional)
# Define projects here to give each one its own board and branching strategy.
# When exactly one project is configured it is used automatically; with more
# than one, set defaults.project or pass -p/--project. Per-project git values
# that are empty fall back to the top-level git section below.
projects:
  MERADIO:
    board_id: "561"
    git:
      branch_template: "feature-v5/{Key}"
      branch_templates:
        Bug: "fix-v5/{Key}"
        Epic: "epic-v5/{Key}"
  ALPHA:
    board_id: "99"
    git:
      branch_template: "release/{Key}"

# Local Storage Settings
storage:
  base: "~/.storage/xyanpse"

# Cache Expiration (hours)
# When a locally cached ticket or sprint is older than this, get commands
# auto-refresh it from the Jira server. Set to 0 to disable auto-refresh.
expiration:
  hours: 24

# OpenCode Integration (used by plan and implement commands)
opencode:
  bin: "opencode"      # Path or name of the opencode binary on PATH
  model: ""            # Optional provider/model override, e.g. "anthropic/claude-sonnet-4"
  auto_approve: false  # Pass --auto to opencode run (implement may edit files without prompting)
  dir: ""              # Target repo directory (default: current working directory)

# Git Integration (used by prepare and finalize commands)
git:
  branch_template: "feature-v5/{Key}"  # Branch naming for prepare; see README for placeholders
  branch_templates:                    # Optional per-issue-type overrides (case-insensitive)
    Bug: "fix-v5/{Key}"
    Epic: "epic/{Key}"
